    <text x="52" y="65">KRUTONIC MOTORSPORT DIVISION</text>
    <text x="52" y="396">FULL-STACK ENGINEERING  /  GUJARAT, INDIA</text>
    <text x="864" y="66">ENGINEERING // 01</text>
    <text x="1022" y="396">KRT-12  •  EST. IN CODE</text>
  </g>
  <path d="M52 82h286" stroke="#E10600" stroke-width="2"/>
  <text x="48" y="174" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="1">KRUTARTH</text>
  <text x="48" y="232" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="1">CHAUHAN</text>
  <path d="M52 254h495" stroke="#E10600" stroke-width="4"/>
