<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Krutarth Chauhan — Krutonic Motorsport Division</title>
  <desc id="desc">A carbon-black motorsport engineering dashboard with racing-red accents, telemetry details, number 12, and an abstract circuit line.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#17171C"/>
    </linearGradient>
    <linearGradient id="redline" x1="0" x2="1">
      <stop offset="0" stop-color="#E10600" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#E10600"/>
      <stop offset="1" stop-color="#E10600" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#fade)"/>
  <rect width="1200" height="430" rx="18" fill="url(#grid)"/>
  <path d="M0 26H1200" stroke="#E10600" stroke-width="5"/>
  <g stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2">
